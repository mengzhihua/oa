server:
  port: 8086
spring:
  application:
    name: oa-backend
  datasource:
    url: jdbc:h2:file:./data/oa;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true
  h2.console.enabled: ${OA_H2_CONSOLE:false}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
mybatis-plus:
  configuration.map-underscore-to-camel-case: true
  global-config.db-config.id-type: auto
oa:
  # 生产环境必须设置为 false，并配置固定的 oa.auth.secret。
  demo.seed: ${OA_DEMO_SEED:true}
  demo.data-location: classpath:demo-data.sql
  auth:
    secret: ${OA_AUTH_SECRET:}
    token-ttl: ${OA_TOKEN_TTL:12h}
    admin-password: ${OA_ADMIN_PASSWORD:admin123}
  cors.allowed-origins: ${OA_CORS_ALLOWED_ORIGINS:http://localhost:5176}
  open:
    api-key: ${OA_OPEN_API_KEY:oa-open-key}
logging.level.com.oa: info
oa.attendance.schedule-enabled: ${OA_ATTENDANCE_SCHEDULE_ENABLED:true}
